<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0F3460" />
            <stop offset="100%" style="stop-color:#2196F3" />
        </linearGradient>
        <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#2E7D32" />
            <stop offset="100%" style="stop-color:#4CAF50" />
        </linearGradient>
        <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#C2185B" />
            <stop offset="100%" style="stop-color:#E91E63" />
        </linearGradient>
    </defs>
    
    <!-- Background rounded -->
    <rect width="200" height="200" rx="30" fill="url(#bgGrad)" />
    
    <!-- Gelombang Suara (Sonic) -->
    <path d="M 50 120 C 80 80, 110 80, 130 110 C 150 140, 170 130, 185 100"
          fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.9" />
    
    <!-- Tiga Bentuk Geometris (Tri) -->
    <polygon points="40,140 70,70 100,140" fill="#FFFFFF" opacity="0.2" />
    <polygon points="60,140 85,80 110,140" fill="#FFFFFF" opacity="0.4" />
    <polygon points="80,140 100,90 120,140" fill="#FFFFFF" opacity="0.6" />
    
    <!-- Tiga Titik (Nada) -->
    <circle cx="160" cy="85" r="6" fill="#FFC107" />
    <circle cx="173" cy="75" r="6" fill="#FFC107" />
    <circle cx="186" cy="65" r="6" fill="#FFC107" />
</svg>