<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <!-- Latar Belakang -->
    <rect width="200" height="200" fill="#0F3460" rx="30" />
    
    <!-- Tiga Segitiga (Tri) -->
    <polygon points="60,130 100,50 140,130" fill="#1a4a7a" />
    <polygon points="40,130 80,70 120,130" fill="#2196F3" />
    <polygon points="20,130 60,80 100,130" fill="#4CAF50" />
    
    <!-- Gelombang Suara (Sonic) -->
    <path d="M 80 130 C 100 90, 120 90, 130 110 C 140 130, 160 130, 170 100"
          fill="none" stroke="#E91E63" stroke-width="8" stroke-linecap="round" />
    
    <!-- Tiga Titik -->
    <circle cx="162" cy="95" r="5" fill="#FFC107" />
    <circle cx="175" cy="87" r="5" fill="#FFC107" />
    <circle cx="188" cy="79" r="5" fill="#FFC107" />
</svg>