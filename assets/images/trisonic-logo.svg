<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E7D32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C2185B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E91E63;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Gelombang Suara (Waveform) -->
  <path d="M 120 60 C 160 60, 180 90, 150 130 C 120 170, 60 160, 30 120 C 10 90, 30 50, 60 40" 
        fill="none" stroke="#0F3460" stroke-width="12" stroke-linecap="round" />
  
  <!-- Segitiga Biru (Inovasi) -->
  <polygon points="50,60 90,140 10,140" fill="url(#blueGrad)" />
  
  <!-- Kotak Hijau (Struktur/Teknologi) -->
  <rect x="80" y="70" width="70" height="70" rx="15" fill="url(#greenGrad)" />
  
  <!-- Lingkaran Magenta (Kreativitas/Energi) -->
  <circle cx="145" cy="135" r="40" fill="url(#magentaGrad)" />
</svg>