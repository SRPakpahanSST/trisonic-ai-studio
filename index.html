<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TriSonic AI Studio</title>
    
    <link rel="icon" type="image/svg+xml" href="assets/images/trisonic-logo.svg" />
    
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/partitur.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    
    <style>
        /* ============================================================
           LANDING PAGE - Style langsung di sini agar pasti terbaca
           ============================================================ */
        #landing-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0e17;
            background-image: 
                radial-gradient(ellipse at 10% 20%, rgba(33, 150, 243, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(233, 30, 99, 0.06) 0%, transparent 50%);
            display: flex !important;
            align-items: center;
            justify-content: center;
            z-index: 99999 !important;
            padding: 2rem;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        
        #landing-page.hidden {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none !important;
        }
        
        #landing-page .landing-content {
            text-align: center;
            max-width: 500px;
            width: 100%;
            animation: landingFadeIn 1s ease-out;
        }
        
        @keyframes landingFadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        #landing-page .landing-image {
            margin-bottom: 2rem;
        }
        
        #landing-page .landing-logo {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(33, 150, 243, 0.15);
            animation: logoPulse 3s ease-in-out infinite;
        }
        
        @keyframes logoPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        #landing-page .landing-title {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #0F3460, #2196F3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }
        
        #landing-page .landing-subtitle {
            font-size: 1.2rem;
            color: #8899aa;
            font-weight: 400;
            margin-bottom: 0.25rem;
        }
        
        #landing-page .landing-description {
            font-size: 0.95rem;
            color: #556677;
            margin-bottom: 2.5rem;
            line-height: 1.5;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        
        #btnMulai {
            display: inline-flex !important;
            align-items: center;
            gap: 10px;
            padding: 0.9rem 3rem !important;
            font-size: 1.2rem !important;
            font-weight: 700 !important;
            font-family: 'Inter', sans-serif !important;
            background: linear-gradient(135deg, #0F3460, #2196F3) !important;
            color: white !important;
            border: none !important;
            border-radius: 50px !important;
            cursor: pointer !important;
            transition: all 0.3s ease !important;
            box-shadow: 0 4px 30px rgba(33, 150, 243, 0.35) !important;
            position: relative !important;
            z-index: 999999 !important;
            pointer-events: auto !important;
        }
        
        #btnMulai:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 40px rgba(33, 150, 243, 0.5);
        }
        
        #btnMulai:active {
            transform: scale(0.96);
        }
        
        #landing-page .landing-version {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #556677;
            letter-spacing: 1px;
        }
        
        @media (max-width: 480px) {
            #landing-page .landing-title { font-size: 2rem; }
            #landing-page .landing-subtitle { font-size: 1rem; }
            #landing-page .landing-description { font-size: 0.85rem; padding: 0 1rem; }
            #landing-page .landing-logo { width: 100px; height: 100px; }
            #btnMulai { padding: 0.7rem 2rem !important; font-size: 1rem !important; }
        }
    </style>
</head>
<body>
    <!-- ============================================ -->
    <!-- LANDING PAGE (HALAMAN AWAL)                  -->
    <!-- ============================================ -->
    <div id="landing-page">
        <div class="landing-content">
            <div class="landing-image">
                <img src="assets/images/landing-logo.jpg" 
                     alt="TriSonic AI Studio" 
                     class="landing-logo"
                     onerror="this.style.display='none'" />
            </div>
            
            <h1 class="landing-title">TriSonic AI Studio</h1>
            <p class="landing-subtitle">Eksplorasi Harmoni Tanpa Batas</p>
            <p class="landing-description">
                A 20-Note Microtonal Ecosystem Powered by Multi-Agent AI for Musicians
            </p>
            
            <button id="btnMulai">🚀 Mulai</button>
            
            <p class="landing-version">v2.0.0</p>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- SPLASH SCREEN                               -->
    <!-- ============================================ -->
    <div id="splash-screen" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#0a0e17; z-index:99998; display:none; align-items:center; justify-content:center; flex-direction:column;">
        <div style="text-align:center; padding:2rem;">
            <svg viewBox="0 0 200 200" width="120" height="120" style="margin:0 auto 1.5rem; display:block;">
                <defs>
                    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#0F3460" />
                        <stop offset="100%" style="stop-color:#2196F3" />
                    </linearGradient>
                    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#2E7D32" />
                        <stop offset="100%" style="stop-color:#4CAF50" />
                    </linearGradient>
                    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#C2185B" />
                        <stop offset="100%" style="stop-color:#E91E63" />
                    </linearGradient>
                </defs>
                <path d="M 120 60 C 160 60, 180 90, 150 130 C 120 170, 60 160, 30 120 C 10 90, 30 50, 60 40" 
                      fill="none" stroke="#0F3460" stroke-width="12" stroke-linecap="round" />
                <polygon points="50,60 90,140 10,140" fill="url(#blueGrad)" />
                <rect x="80" y="70" width="70" height="70" rx="15" fill="url(#greenGrad)" />
                <circle cx="145" cy="135" r="40" fill="url(#magentaGrad)" />
            </svg>
            
            <h1 style="font-size:2.5rem; font-weight:800; background:linear-gradient(135deg, #0F3460, #2196F3); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:0.25rem;">TriSonic AI Studio</h1>
            <p style="color:#8899aa; font-size:1.1rem;">Eksplorasi Harmoni Tanpa Batas</p>
            <p style="color:#556677; font-size:0.85rem;">20-Note Microtonal Ecosystem · Multi-Agent AI</p>
            <div style="width:200px; height:4px; background:#1a2332; border-radius:4px; margin:1.5rem auto 0.5rem; overflow:hidden;">
                <div id="loaderBar" style="height:100%; width:0%; background:linear-gradient(90deg, #0F3460, #2196F3); border-radius:4px; transition:width 0.1s linear;"></div>
            </div>
            <p style="color:#556677; font-size:0.75rem; margin-top:0.5rem;">v2.0.0</p>
        </div>
    </div>
    
    <!-- ============================================ -->
    <!-- MAIN APP                                     -->
    <!-- ============================================ -->
    <div id="app" style="display:none; flex-direction:column; min-height:100vh;">
        <!-- ... (isi app sama seperti sebelumnya) ... -->
    </div>
    
    <!-- ============================================ -->
    <!-- JAVASCRIPT                                  -->
    <!-- ============================================ -->
    <script>
        // ============================================================
        // SIMPLE APP.JS - LANGSUNG DI SINI UNTUK TESTING
        // ============================================================
        
        (function() {
            'use strict';
            
            console.log('📄 DOM siap, memulai setup...');
            
            // ---------- DOM References ----------
            const landingPage = document.getElementById('landing-page');
            const splashScreen = document.getElementById('splash-screen');
            const appContainer = document.getElementById('app');
            const btnMulai = document.getElementById('btnMulai');
            const loaderBar = document.getElementById('loaderBar');
            
            // ---------- Fungsi ----------
            function showSplash() {
                console.log('🟡 Menampilkan splash screen...');
                if (landingPage) {
                    landingPage.classList.add('hidden');
                }
                
                if (splashScreen) {
                    splashScreen.style.display = 'flex';
                }
                
                // Animasi loader
                if (loaderBar) {
                    let progress = 0;
                    const interval = setInterval(() => {
                        progress += Math.random() * 10;
                        if (progress >= 100) {
                            progress = 100;
                            clearInterval(interval);
                            setTimeout(() => {
                                hideSplash();
                            }, 500);
                        }
                        loaderBar.style.width = progress + '%';
                    }, 150);
                } else {
                    // Fallback jika loader tidak ditemukan
                    setTimeout(() => {
                        hideSplash();
                    }, 2500);
                }
            }
            
            function hideSplash() {
                console.log('🟢 Menyembunyikan splash, menampilkan aplikasi...');
                if (splashScreen) {
                    splashScreen.style.display = 'none';
                }
                if (appContainer) {
                    appContainer.style.display = 'flex';
                }
                console.log('✅ Aplikasi siap digunakan!');
            }
            
            // ---------- Event Listener Tombol ----------
            if (btnMulai) {
                console.log('🔵 Tombol Mulai ditemukan, memasang event listener...');
                
                // Hapus semua event listener lama (pakai clone)
                const newBtn = btnMulai.cloneNode(true);
                btnMulai.parentNode.replaceChild(newBtn, btnMulai);
                
                // Pasang event listener baru
                newBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    console.log('🟢 Tombol Mulai DIKLIK!');
                    showSplash();
                });
                
                // Backup: pasang juga dengan cara lain
                document.getElementById('btnMulai')?.addEventListener('click', function(e) {
                    console.log('🟢 Tombol Mulai DIKLIK (backup)!');
                    showSplash();
                });
                
                console.log('✅ Event listener tombol Mulai terpasang!');
            } else {
                console.error('❌ Tombol Mulai TIDAK DITEMUKAN!');
            }
            
            // ---------- Fallback: Coba pasang ulang setelah 1 detik ----------
            setTimeout(function() {
                const btn = document.getElementById('btnMulai');
                if (btn) {
                    btn.addEventListener('click', function(e) {
                        console.log('🟢 Tombol Mulai DIKLIK (fallback)!');
                        showSplash();
                    });
                }
            }, 1000);
            
        })();
    </script>
    
    <!-- Load file JS lainnya -->
    <script src="js/data/frequencies.js"></script>
    <script src="js/data/notes.js"></script>
    <script src="js/audio/engine.js"></script>
    <script src="js/audio/keyboard.js"></script>
    <script src="js/features/aiComposer.js"></script>
    <script src="js/features/aiTranscriber.js"></script>
    <script src="js/features/chordProgression.js"></script>
    <script src="js/features/partiturEditor.js"></script>
    <script src="js/ui/tutorial.js"></script>
    <script src="js/ui/dashboard.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
