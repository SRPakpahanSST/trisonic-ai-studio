<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>TriSonic Keyboard - 20 Nada</title>
    <style>
        /* Style keyboard di sini */
        .keyboard-flex {
            display: flex;
            gap: 2px;
            padding: 10px;
            background: #1a1a2e;
            border-radius: 10px;
            overflow-x: auto;
        }
        .key-white {
            flex: 0 0 32px;
            height: 150px;
            background: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 0 0 6px 6px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 10px;
            z-index: 1;
        }
        .key-black {
            flex: 0 0 22px;
            height: 90px;
            background: #222;
            border: 1px solid #111;
            border-radius: 0 0 6px 6px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 6px;
            margin-left: -11px;
            margin-right: -11px;
            z-index: 2;
        }
        .key-white.active { background: #ffd700; }
        .key-black.active { background: #ffd700; }
        .key-label { font-size: 0.6rem; color: #333; pointer-events: none; }
        .key-black .key-label { color: #888; }
        .pitch-display {
            padding: 10px;
            background: #1a1a2e;
            border-radius: 8px;
            margin-top: 10px;
            color: #fff;
            font-family: monospace;
        }
        .pitch-display strong { color: #ffd700; }
    </style>
</head>
<body>
    <div id="keyboard" class="keyboard-flex"></div>
    <div class="pitch-display">
        <span>Nada: <strong id="currentNote">-</strong></span>
        <span>Frekuensi: <strong id="currentFreq">-</strong> Hz</span>
        <span>Oktaf: <strong id="currentOctave">-</strong></span>
    </div>

    <script>
        // ============================================================
        // DATA FREKUENSI LENGKAP
        // ============================================================
        const FREQ_MAP = {
            'C2': 60.90000, 'C#2': 64.34000, 'D2': 67.97400,
            'E3': 71.81300, 'E#3': 75.86800, 'F3': 80.15200, 'F#3': 84.67800,
            'G3': 89.46000, 'G#3': 94.51100, 'H3': 99.84800, 'H#3': 105.48600,
            'I3': 111.44300, 'J3': 117.73500, 'J#3': 124.38400, 'K3': 131.40700,
            'K#3': 138.82700, 'A3': 146.66700, 'A#3': 154.94900, 'B3': 163.69800,
            'B#3': 172.94200, 'C3': 182.70700, 'C#3': 193.02400, 'D3': 203.92400,
            'E4': 215.43900, 'E#4': 227.60400, 'F4': 240.45600, 'F#4': 254.03400,
            'G4': 268.37900, 'G#4': 283.53300, 'H4': 299.54400, 'H#4': 316.45800,
            'I4': 334.32800, 'J4': 353.20600, 'J#4': 373.15100, 'K4': 394.22200,
            'K#4': 416.48200, 'A4': 440.00000, 'A#4': 464.84600, 'B4': 491.09400,
            'B#4': 518.82500, 'C4': 548.12200, 'C#4': 579.07300, 'D4': 611.77100,
            'E5': 646.31600, 'E#5': 682.81200, 'F5': 721.36900, 'F#5': 762.10200,
            'G5': 805.13600, 'G#5': 850.60000, 'H5': 898.63100, 'H#5': 949.37400,
            'I5': 1002.98300, 'J5': 1059.61900, 'J#5': 1119.45300, 'K5': 1182.66500,
            'K#5': 1249.44700, 'A5': 1320.00000, 'A#5': 1394.53700, 'B5': 1473.28300,
            'B#5': 1556.47500, 'C5': 1644.36500, 'C#5': 1737.21800, 'D5': 1835.31400,
            'E6': 1938.94900, 'E#6': 2048.43600, 'F6': 2164.10600, 'F#6': 2286.30700,
            'G6': 2415.40900, 'G#6': 2551.80000, 'H6': 2695.89400, 'H#6': 2848.12300,
            'I6': 3008.94900, 'J6': 3178.85700, 'J#6': 3358.35800, 'K6': 3547.99600,
            'K#6': 3748.34100, 'A6': 3960.00000, 'A#6': 4183.61100, 'B6': 4419.84800,
            'B#6': 4669.42500, 'C6': 4933.09500, 'C#6': 5211.65300, 'D6': 5505.94200
        };

        const NOTES_20 = ['E','E#','F','F#','G','G#','H','H#','I','J','J#','K','K#','A','A#','B','B#','C','C#','D'];
        const NOTE_TO_INDEX = {};
        NOTES_20.forEach((n, i) => NOTE_TO_INDEX[n] = i);

        function getNoteName(idx) { return NOTES_20[idx % 20] || 'E'; }
        function getNoteIndex(n) { return NOTE_TO_INDEX[n] !== undefined ? NOTE_TO_INDEX[n] : 0; }
        function getFreq(n) { return FREQ_MAP[n] || 0; }
        function formatFreq(f) { return f.toFixed(5); }

        function getAllNotes() {
            const result = [];
            for (let oct = 2; oct <= 6; oct++) {
                for (const note of NOTES_20) {
                    const name = note + oct;
                    if (FREQ_MAP[name] !== undefined) result.push(name);
                }
            }
            return result;
        }

        // ============================================================
        // RENDER KEYBOARD
        // ============================================================
        const container = document.getElementById('keyboard');
        const noteDisplay = document.getElementById('currentNote');
        const freqDisplay = document.getElementById('currentFreq');
        const octaveDisplay = document.getElementById('currentOctave');

        function renderKeyboard() {
            container.innerHTML = '';
            const allNotes = getAllNotes();

            allNotes.forEach(noteName => {
                const freq = getFreq(noteName);
                const match = noteName.match(/^([A-Z#]+)(\d+)$/);
                if (!match) return;
                const [, note, octave] = match;
                const idx = getNoteIndex(note);
                const isWhite = idx % 2 === 0;

                const key = document.createElement('div');
                key.className = `key ${isWhite ? 'key-white' : 'key-black'}`;
                key.dataset.note = noteName;
                key.dataset.freq = freq;
                key.dataset.octave = octave;
                key.dataset.isWhite = isWhite;

                const label = document.createElement('span');
                label.className = 'key-label';
                label.textContent = note;
                key.appendChild(label);

                key.title = `${noteName} - ${formatFreq(freq)} Hz`;

                key.addEventListener('click', () => {
                    // Toggle active
                    const isActive = key.classList.contains('active');
                    document.querySelectorAll('.key.active').forEach(k => k.classList.remove('active'));
                    if (!isActive) {
                        key.classList.add('active');
                        noteDisplay.textContent = noteName;
                        freqDisplay.textContent = formatFreq(freq);
                        octaveDisplay.textContent = octave;
                    } else {
                        noteDisplay.textContent = '-';
                        freqDisplay.textContent = '-';
                        octaveDisplay.textContent = '-';
                    }
                });

                container.appendChild(key);
            });
        }

        renderKeyboard();
        console.log('✅ Keyboard siap dengan ' + getAllNotes().length + ' tuts (C2-D6)');
    </script>
</body>
</html>
